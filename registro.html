<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="columnaRegistro">
        <h2 style="text-align: center;">Formulario de Registro</h2>
        <div>
            <h4>Nombre Completo</h4>
            <div>
                <input type="text" id="inputNombre" placeholder="Nombres">
            </div>

            <div>
                <input type="text" id="inputApellido" placeholder="Apellidos">
            </div>
        </div>

        <div>
            <h4>Documento</h4>
            <div>
                <input type="text" id="inputTipoDocumento" placeholder="Tipo de documento">
            </div>

            <div>
                <input type="text" id="inputNumero" placeholder="Número del documento">
            </div>
        </div>

        <div>
            <h4>Dirección</h4>
            <div>
                <input type="text" id="inputDireccion">
            </div>
        </div>

        <div>
            <h4>Número de teléfono</h4>
            <div>
                <input type="text" id="inputTelefono">
            </div>
        </div>

        <div>
            <h4>Dirección del correo electrónico</h4>
            <div>
                <input type="text" id="inputCorreo">
            </div>
        </div>

         <div><button type="button" id="botonConfirmar">Confirmar</button></div>

    </div>

    <script src="app.js"></script>
</body>

</html>
